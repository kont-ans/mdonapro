<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>إنشاء حساب — مدونتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css"/>
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="/index.html" class="logo">✦ مدونتي</a>
        <a href="/index.html" class="back-link">← الرئيسية</a>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-icon">✨</div>
      <h1 class="auth-title">إنشاء حساب جديد</h1>
      <p class="auth-sub">انضم إلى مجتمعنا اليوم</p>

      <div id="error-msg"   class="auth-error"   style="display:none"></div>
      <div id="success-msg" class="auth-success"  style="display:none"></div>

      <form id="register-form" class="auth-form" onsubmit="doRegister(event)">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" id="username" placeholder="اسمك هنا" required minlength="3" maxlength="30"/>
        </div>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="example@email.com" required/>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="8 أحرف على الأقل" required minlength="8" oninput="updateStrength(this.value)"/>
            <button type="button" class="toggle-pw" onclick="togglePw('password')">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label>تأكيد كلمة المرور</label>
          <div class="input-wrap">
            <input type="password" id="password2" placeholder="••••••••" required/>
            <button type="button" class="toggle-pw" onclick="togglePw('password2')">👁</button>
          </div>
        </div>

        <div class="strength-bar-wrap">
          <div class="strength-bar" id="strength-bar"></div>
        </div>
        <p class="strength-label" id="strength-label"></p>

        <button type="submit" class="btn-auth" id="reg-btn">إنشاء الحساب</button>
      </form>

      <div class="auth-footer">
        <p>لديك حساب؟ <a href="/login.html" class="auth-link">تسجيل الدخول</a></p>
      </div>
    </div>
  </main>

  <script src="/auth.js"></script>
  <script>
    var STRENGTH_CLASSES = ['', 'weak', 'fair', 'good', 'strong'];
    var STRENGTH_LABELS  = ['', '🔴 ضعيفة', '🟡 مقبولة', '🟢 جيدة', '💪 قوية جداً'];

    function updateStrength(val) {
      var score = passwordStrength(val);
      var bar   = document.getElementById('strength-bar');
      var lbl   = document.getElementById('strength-label');
      bar.className   = 'strength-bar ' + (STRENGTH_CLASSES[score] || '');
      lbl.textContent = STRENGTH_LABELS[score] || '';
    }

    async function doRegister(e) {
      e.preventDefault();
      var username  = document.getElementById('username').value.trim();
      var email     = document.getElementById('email').value.trim().toLowerCase();
      var password  = document.getElementById('password').value;
      var password2 = document.getElementById('password2').value;
      var btn       = document.getElementById('reg-btn');
      var errEl     = document.getElementById('error-msg');
      var okEl      = document.getElementById('success-msg');

      errEl.style.display = 'none';
      okEl.style.display  = 'none';

      if (password !== password2) { showError(errEl, 'كلمتا المرور غير متطابقتان.'); return; }
      if (passwordStrength(password) < 2) { showError(errEl, 'كلمة المرور ضعيفة جداً، أضف أرقاماً أو رموزاً.'); return; }

      btn.textContent = '⏳ جاري...';
      btn.disabled    = true;

      try {
        var users = await getUsers();
        var emailExists    = users.find(function(u){ return u.email === email; });
        var usernameExists = users.find(function(u){ return u.username && u.username.toLowerCase() === username.toLowerCase(); });

        if (emailExists)    { showError(errEl, 'هذا البريد الإلكتروني مسجل مسبقاً.'); return; }
        if (usernameExists) { showError(errEl, 'اسم المستخدم محجوز، جرب اسماً آخر.'); return; }

        var hash    = await hashPassword(password);
        var newUser = {
          id:            Date.now(),
          username:      username,
          email:         email,
          password_hash: hash,
          joined:        new Date().toISOString(),
          banned:        false
        };

        var ok = await registerUser(newUser);
        if (ok) {
          okEl.textContent   = '✅ تم إنشاء حسابك! جاري التحويل لتسجيل الدخول...';
          okEl.style.display = 'block';
          setTimeout(function(){ window.location.href = '/login.html'; }, 1500);
        } else {
          showError(errEl, 'فشل الحفظ، حاول مرة أخرى.');
        }
      } catch(err) {
        showError(errEl, 'حدث خطأ غير متوقع.');
        console.error(err);
      } finally {
        btn.textContent = 'إنشاء الحساب';
        btn.disabled    = false;
      }
    }
  </script>
</body>
</html>
