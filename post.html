<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مقالة — مدونتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="/index.html" class="logo">✦ مدونتي</a>
        <a href="/index.html" class="back-link">← العودة للرئيسية</a>
      </div>
    </div>
  </header>

  <main>
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>جاري تحميل المقالة...</p>
    </div>

    <article id="post-content" class="post-page" style="display:none">
      <div class="container post-container">
        <header class="post-header">
          <h1 id="post-title" class="post-title"></h1>
          <div class="post-meta">
            <span id="post-date"  class="post-date"></span>
            <span class="meta-sep">·</span>
            <span id="post-views" class="post-views"></span>
          </div>
        </header>
        <div id="post-media" class="post-media"></div>
        <div id="post-body"  class="post-body"></div>
        <div class="post-share">
          <button onclick="sharePost()" class="share-btn">🔗 مشاركة المقالة</button>
        </div>
      </div>
    </article>

    <div id="not-found" class="not-found" style="display:none">
      <div class="container">
        <h2>404 — المقالة غير موجودة</h2>
        <a href="/index.html" class="btn-primary">العودة للرئيسية</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> مدونتي — جميع الحقوق محفوظة</p>
    </div>
  </footer>

  <script src="/auth.js"></script>
  <script src="/post.js"></script>
</body>
</html>
