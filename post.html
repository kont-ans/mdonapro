<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنستا-مينا - المنشور</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.post-detail img{width:100%;max-height:500px;object-fit:cover}
.comments-list{padding:0 12px}
.comment-item{display:flex;gap:10px;margin-bottom:14px}
.comment-body{flex:1}
.comment-username{font-weight:700;font-size:13px}
.comment-text{font-size:14px;line-height:1.5}
.comment-time{font-size:11px;color:var(--text2);margin-top:2px}
.add-comment{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:50}
.comment-input{flex:1;border:none;background:transparent;font-size:14px;color:var(--text);outline:none}
.send-btn{color:var(--blue);font-weight:700;font-size:14px;padding:4px 8px}
.post-actions-bar{display:flex;align-items:center;padding:6px 12px;gap:12px}
.post-actions-bar button{background:none;border:none;cursor:pointer;color:var(--text);font-size:24px;padding:4px}
.save-bar{margin-right:auto;margin-left:0}
.liked-heart{color:#ed4956}
</style>
</head>
<body>
<div class="header">
  <a href="javascript:history.back()" class="back-btn"><i class="fa fa-arrow-right"></i></a>
  <div class="header-title">المنشور</div>
  <div class="header-actions">
    <button onclick="sharePost()"><i class="fa fa-paper-plane-o"></i></button>
  </div>
</div>
<div class="page-content" style="padding-bottom:80px" id="post-detail"></div>
<div class="add-comment" id="comment-bar" style="display:none">
  <div id="my-avatar"></div>
  <input type="text" class="comment-input" id="comment-input" placeholder="أضف تعليقاً..." maxlength="500">
  <button class="send-btn" onclick="submitComment()">نشر</button>
</div>
<div class="toast-container" id="toast-container"></div>
<script src="js/db.js"></script>
<script>
let currentUser, post, postUser, liked, saved;
async function init() {
  await InstaMina.init();
  currentUser = InstaMina.requireAuth();
  if(!currentUser) return;
  const params = new URLSearchParams(location.search);
  const postId = params.get('id');
  if(!postId) { window.location.href='feed.html'; return; }
  post = await InstaMina.getPostById(postId);
  if(!post) { document.getElementById('post-detail').innerHTML='<div class="empty-state"><i class="fa fa-image"></i><h3>المنشور غير موجود</h3></div>'; return; }
  postUser = await InstaMina.getUserById(post.userId);
  liked = !!(await InstaMina.getLike(post.id, currentUser.id));
  saved = await InstaMina.isSaved(currentUser.id, post.id);
  await renderPost();
  await loadComments();
  document.getElementById('comment-bar').style.display='flex';
  const myAvatar = document.getElementById('my-avatar');
  myAvatar.innerHTML = currentUser.avatar?`<img src="${currentUser.avatar}" class="avatar" style="width:32px;height:32px">`:`<div class="avatar-placeholder" style="width:32px;height:32px;font-size:12px">${currentUser.username[0].toUpperCase()}</div>`;
}
async function renderPost() {
  const detail = document.getElementById('post-detail');
  detail.innerHTML=`
    <div class="post-detail">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px">
        <div style="display:flex;align-items:center;gap:10px;cursor:pointer" onclick="window.location.href='profile.html?userId=${postUser?.id}'">
          ${postUser?.avatar?`<img src="${postUser.avatar}" class="avatar" style="width:36px;height:36px">`:`<div class="avatar-placeholder" style="width:36px;height:36px;font-size:14px">${postUser?.username[0]?.toUpperCase()||'?'}</div>`}
          <div><div style="font-weight:700;font-size:14px">${postUser?.username||'مجهول'}${postUser?.isVerified?'<i class="fa fa-check-circle verified"></i>':''}</div>${post.location?`<div style="font-size:11px;color:var(--text2)"><i class="fa fa-map-marker"></i> ${post.location}</div>`:''}</div>
        </div>
        <button onclick="showMenu()"><i class="fa fa-ellipsis-h"></i></button>
      </div>
      ${post.image?`<img src="${post.image}" alt="منشور" loading="lazy">`:''}
      <div class="post-actions-bar">
        <button class="${liked?'liked-heart':''}" onclick="toggleLike()" id="like-btn"><i class="fa ${liked?'fa-heart':'fa-heart-o'}"></i></button>
        <button onclick="document.getElementById('comment-input').focus()"><i class="fa fa-comment-o"></i></button>
        <button onclick="sharePost()"><i class="fa fa-paper-plane-o"></i></button>
        <button class="save-bar" onclick="toggleSave()" id="save-btn"><i class="fa ${saved?'fa-bookmark':'fa-bookmark-o'}"></i></button>
      </div>
      <div style="padding:0 12px;font-size:14px;font-weight:700" id="likes-count">${InstaMina.formatCount(post.likesCount||0)} إعجاب</div>
      ${post.caption?`<div style="padding:4px 12px;font-size:14px;line-height:1.5"><span style="font-weight:700;margin-left:6px;cursor:pointer" onclick="window.location.href='profile.html?userId=${postUser?.id}'">${postUser?.username}</span>${post.caption}</div>`:''}
      <div style="padding:2px 12px 8px;font-size:11px;color:var(--text2)">${InstaMina.timeAgo(post.createdAt)}</div>
      <div style="padding:8px 12px;font-size:13px;font-weight:700;border-top:1px solid var(--border)">التعليقات</div>
    </div>
    <div class="comments-list" id="comments-list"></div>`;
}
async function loadComments() {
  const comments = await InstaMina.getCommentsByPost(post.id);
  const list = document.getElementById('comments-list');
  if(comments.length===0) { list.innerHTML='<div style="padding:16px 12px;color:var(--text2);font-size:13px;text-align:center">كن أول من يعلق!</div>'; return; }
  list.innerHTML='';
  for(const c of comments) {
    const u = await InstaMina.getUserById(c.userId);
    if(!u) continue;
    const item=document.createElement('div'); item.className='comment-item'; item.dataset.commentId=c.id;
    item.innerHTML=`
      ${u.avatar?`<img src="${u.avatar}" class="avatar" style="width:32px;height:32px">`:`<div class="avatar-placeholder" style="width:32px;height:32px;font-size:12px">${u.username[0].toUpperCase()}</div>`}
      <div class="comment-body">
        <div><span class="comment-username" onclick="window.location.href='profile.html?userId=${u.id}'">${u.username}</span> <span class="comment-text">${c.text}</span></div>
        <div class="comment-time">${InstaMina.timeAgo(c.createdAt)}</div>
      </div>
      ${c.userId===currentUser.id||post.userId===currentUser.id?`<button onclick="deleteComment(${c.id})" style="color:var(--text2);font-size:12px;align-self:flex-start;padding:2px"><i class="fa fa-trash-o"></i></button>`:''}`;
    list.appendChild(item);
  }
}
async function toggleLike() {
  const now=await InstaMina.toggleLike(post.id,currentUser.id);
  liked=now;
  const btn=document.getElementById('like-btn');
  btn.className=now?'liked-heart':'';
  btn.innerHTML=`<i class="fa ${now?'fa-heart':'fa-heart-o'}"></i>`;
  const p=await InstaMina.getPostById(post.id);
  document.getElementById('likes-count').textContent=InstaMina.formatCount(p.likesCount||0)+' إعجاب';
  if(now&&post.userId!==currentUser.id) await InstaMina.addNotification({userId:post.userId,type:'like',fromId:currentUser.id,postId:post.id,text:`${currentUser.username} أعجب بمنشورك`});
}
async function toggleSave() {
  saved=await InstaMina.toggleSaved(currentUser.id,post.id);
  document.getElementById('save-btn').innerHTML=`<i class="fa ${saved?'fa-bookmark':'fa-bookmark-o'}"></i>`;
  showToast(saved?'تم الحفظ ✓':'تم إلغاء الحفظ');
}
async function submitComment() {
  const input=document.getElementById('comment-input');
  const text=input.value.trim();
  if(!text) return;
  input.value='';
  await InstaMina.addComment({postId:post.id,userId:currentUser.id,text});
  if(post.userId!==currentUser.id) await InstaMina.addNotification({userId:post.userId,type:'comment',fromId:currentUser.id,postId:post.id,text:`${currentUser.username} علق: ${text.slice(0,30)}`});
  await loadComments();
}
async function deleteComment(id) {
  if(!confirm('حذف هذا التعليق؟')) return;
  await InstaMina.deleteComment(id);
  document.querySelector(`[data-comment-id="${id}"]`)?.remove();
}
function showMenu() {
  const isOwn=postUser?.id===currentUser.id;
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><div style="display:flex;flex-direction:column">
    ${isOwn?`<button onclick="deletePost()" style="padding:16px;color:var(--red);border-bottom:1px solid var(--border)">حذف المنشور</button>`:''}
    <button onclick="window.location.href='share.html?id=${post.id}'" style="padding:16px;border-bottom:1px solid var(--border)">مشاركة</button>
    <button onclick="copyLink()" style="padding:16px;border-bottom:1px solid var(--border)">نسخ الرابط</button>
    ${!isOwn?`<button onclick="reportPost()" style="padding:16px;color:var(--red);border-bottom:1px solid var(--border)">إبلاغ</button>`:''}
    <button onclick="this.closest('.overlay').remove()" style="padding:16px">إلغاء</button>
  </div></div>`;
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
}
async function deletePost(){document.querySelector('.overlay')?.remove();await InstaMina.deletePost(post.id);showToast('تم الحذف');setTimeout(()=>window.location.href='profile.html',1000);}
async function reportPost(){document.querySelector('.overlay')?.remove();await InstaMina.addReport({type:'post',targetId:post.id,reporterId:currentUser.id,reason:'محتوى مخالف'});showToast('تم الإبلاغ');}
function copyLink(){navigator.clipboard?.writeText(location.href).then(()=>showToast('تم نسخ الرابط'));document.querySelector('.overlay')?.remove();}
function sharePost(){if(navigator.share)navigator.share({title:'إنستا-مينا',url:location.href}).catch(()=>{});else showToast('جارٍ المشاركة...');}
document.addEventListener('keydown',e=>{if(e.key==='Enter')submitComment();});
function showToast(msg){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2500);}
init();
</script>
</body>
</html>
