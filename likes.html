<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنستا-مينا - الإعجابات</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.user-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.user-row:hover{background:var(--bg2)}
</style>
</head>
<body>
<div class="header">
  <a href="javascript:history.back()" class="back-btn"><i class="fa fa-arrow-right"></i></a>
  <div class="header-title">الإعجابات</div>
</div>
<div class="page-content" id="likes-list"><div class="loader"><div class="spinner"></div></div></div>
<script src="js/db.js"></script>
<script>
async function init() {
  await InstaMina.init();
  const currentUser=InstaMina.requireAuth();
  if(!currentUser) return;
  const params=new URLSearchParams(location.search);
  const postId=params.get('postId');
  if(!postId){window.location.href='feed.html';return;}
  const likes=await InstaMina.getLikesByPost(postId);
  const list=document.getElementById('likes-list');
  if(likes.length===0){list.innerHTML='<div class="empty-state"><i class="fa fa-heart-o"></i><h3>لا إعجابات بعد</h3></div>';return;}
  list.innerHTML='';
  for(const l of likes){
    const u=await InstaMina.getUserById(l.userId);
    if(!u) continue;
    const row=document.createElement('div');row.className='user-row';
    row.onclick=()=>window.location.href=`profile.html?userId=${u.id}`;
    row.innerHTML=`${u.avatar?`<img src="${u.avatar}" class="avatar" style="width:44px;height:44px">`:`<div class="avatar-placeholder" style="width:44px;height:44px;font-size:16px">${u.username[0].toUpperCase()}</div>`}
    <div style="flex:1"><div style="font-weight:700;font-size:14px">${u.username}${u.isVerified?'<i class="fa fa-check-circle" style="color:var(--blue);font-size:11px;margin-right:4px"></i>':''}</div><div style="font-size:12px;color:var(--text2)">${u.fullName||''}</div></div>
    <i class="fa fa-heart" style="color:var(--red)"></i>`;
    list.appendChild(row);
  }
}
init();
</script>
</body>
</html>
