<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنستا-مينا - ريلز</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
body{background:#000;overflow:hidden}
.reels-container{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels-container::-webkit-scrollbar{display:none}
.reel-item{height:100vh;width:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#111}
.reel-video{width:100%;height:100%;object-fit:cover;position:absolute}
.reel-bg{width:100%;height:100%;object-fit:cover;position:absolute;filter:blur(20px);opacity:.5}
.reel-overlay{position:absolute;inset:0;display:flex}
.reel-right{position:absolute;right:12px;bottom:120px;display:flex;flex-direction:column;align-items:center;gap:20px;z-index:10}
.reel-action{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
.reel-action i{font-size:26px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.reel-action span{font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.reel-bottom{position:absolute;bottom:80px;left:12px;right:60px;z-index:10;color:#fff}
.reel-user{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.reel-username{font-weight:700;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.reel-follow-btn{border:1.5px solid #fff;border-radius:6px;padding:4px 12px;font-size:13px;font-weight:700;color:#fff;background:transparent;cursor:pointer}
.reel-caption{font-size:14px;line-height:1.5;text-shadow:0 1px 3px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reel-music{font-size:12px;margin-top:6px;text-shadow:0 1px 3px rgba(0,0,0,.5);display:flex;align-items:center;gap:6px}
.music-icon{animation:spin 3s linear infinite;display:inline-block}
.liked-r{color:#ed4956}
.nav-bottom{background:rgba(0,0,0,.3);border-top-color:rgba(255,255,255,.1)}
.nav-bottom a{color:rgba(255,255,255,.7)}
.nav-bottom a.active{color:#fff}
.placeholder-reel{width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;align-items:center;justify-content:center}
.placeholder-reel i{font-size:80px;color:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="reels-container" id="reels-container"></div>
<nav class="nav-bottom">
  <a href="feed.html"><i class="fa fa-home"></i></a>
  <a href="explore.html"><i class="fa fa-search"></i></a>
  <a href="create.html"><i class="fa fa-plus-square-o" style="font-size:30px"></i></a>
  <a href="reels.html" class="active"><i class="fa fa-film"></i></a>
  <a href="profile.html"><i class="fa fa-user-o"></i></a>
</nav>
<div class="toast-container" id="toast-container"></div>
<script src="js/db.js"></script>
<script>
let currentUser;
async function init() {
  await InstaMina.init();
  currentUser = InstaMina.requireAuth();
  if(!currentUser) return;
  const all = await InstaMina.getAllPosts();
  const reels = all.filter(p=>p.type==='reel');
  const filler = all.slice(0,10);
  const displayReels = reels.length>0 ? reels : filler;
  const container = document.getElementById('reels-container');
  for(const reel of displayReels) {
    const user = await InstaMina.getUserById(reel.userId);
    if(!user) continue;
    const liked = await InstaMina.getLike(reel.id, currentUser.id);
    const isFollowing = !!(await InstaMina.getFollow(currentUser.id, reel.userId));
    const item = document.createElement('div');
    item.className='reel-item'; item.dataset.reelId=reel.id;
    item.innerHTML=`
      ${reel.image?`<img src="${reel.image}" class="reel-bg"><img src="${reel.image}" class="reel-video">`:
      reel.video?`<video src="${reel.video}" class="reel-video" loop muted playsinline autoplay></video>`:
      `<div class="placeholder-reel"><i class="fa fa-play-circle"></i></div>`}
      <div class="reel-overlay">
        <div class="reel-right">
          <div class="reel-action" onclick="goProfile(${user.id})">
            ${user.avatar?`<img src="${user.avatar}" class="avatar" style="width:44px;height:44px;border:2px solid #fff">`:`<div class="avatar-placeholder" style="width:44px;height:44px;font-size:16px;border:2px solid #fff">${user.username[0].toUpperCase()}</div>`}
          </div>
          <div class="reel-action" onclick="toggleLike(${reel.id},this)" data-liked="${!!liked}">
            <i class="fa ${liked?'fa-heart liked-r':'fa-heart-o'}"></i>
            <span id="rlike-${reel.id}">${InstaMina.formatCount(reel.likesCount||0)}</span>
          </div>
          <div class="reel-action" onclick="window.location.href='post.html?id=${reel.id}'">
            <i class="fa fa-comment-o"></i>
            <span>${InstaMina.formatCount(reel.commentsCount||0)}</span>
          </div>
          <div class="reel-action" onclick="window.location.href='share.html?id=${reel.id}'">
            <i class="fa fa-paper-plane-o"></i>
          </div>
          <div class="reel-action">
            <i class="fa fa-ellipsis-v"></i>
          </div>
        </div>
        <div class="reel-bottom">
          <div class="reel-user">
            <div class="reel-username" onclick="goProfile(${user.id})">@${user.username}</div>
            ${user.id!==currentUser.id?`<button class="reel-follow-btn" onclick="toggleFollow(${user.id},this)">${isFollowing?'يتابع':'متابعة'}</button>`:''}
          </div>
          ${reel.caption?`<div class="reel-caption">${reel.caption}</div>`:''}
          <div class="reel-music"><span class="music-icon"><i class="fa fa-music"></i></span> <span>إنستا-مينا الصوت الأصلي</span></div>
        </div>
      </div>`;
    container.appendChild(item);
  }
  if(displayReels.length===0) {
    container.innerHTML=`<div class="reel-item"><div class="placeholder-reel" style="flex-direction:column;gap:16px"><i class="fa fa-film"></i><p style="color:#fff;font-size:16px">لا توجد ريلز بعد</p><a href="upload-reel.html" style="background:var(--blue);color:#fff;padding:10px 24px;border-radius:8px;font-weight:700">أنشئ ريل</a></div></div>`;
  }
}
async function toggleLike(postId,el) {
  const liked = el.dataset.liked==='true';
  const now = await InstaMina.toggleLike(postId,currentUser.id);
  el.dataset.liked=now;
  el.querySelector('i').className=`fa ${now?'fa-heart liked-r':'fa-heart-o'}`;
  const post = await InstaMina.getPostById(postId);
  const span=document.getElementById(`rlike-${postId}`);
  if(span&&post) span.textContent=InstaMina.formatCount(post.likesCount||0);
}
async function toggleFollow(userId,btn) {
  const now=await InstaMina.toggleFollow(currentUser.id,userId);
  btn.textContent=now?'يتابع':'متابعة';
}
function goProfile(id){window.location.href=`profile.html?userId=${id}`;}
function showToast(msg){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2500);}
init();
</script>
</body>
</html>
