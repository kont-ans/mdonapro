<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنستا-مينا - الإشارة لأشخاص</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.user-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.user-row:hover{background:var(--bg2)}
.tagged-badge{position:absolute;top:4px;right:4px;background:var(--blue);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:2px 6px}
.tagged-section{padding:10px 16px;border-bottom:1px solid var(--border)}
.tagged-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:700;margin:3px}
</style>
</head>
<body>
<div class="header">
  <a href="javascript:history.back()" class="back-btn"><i class="fa fa-arrow-right"></i></a>
  <div class="header-title">الإشارة لأشخاص</div>
  <button onclick="saveTags()" style="color:var(--blue);font-weight:700;font-size:15px">تم</button>
</div>
<div class="page-content" style="padding-bottom:20px">
  <div style="padding:8px 12px;border-bottom:1px solid var(--border);position:sticky;top:44px;background:var(--bg)">
    <div style="position:relative">
      <i class="fa fa-search" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text2)"></i>
      <input type="search" class="form-input" id="tag-search" placeholder="ابحث عن مستخدم..." style="padding-right:38px" oninput="searchUsers(this.value)">
    </div>
  </div>
  <div class="tagged-section" id="tagged-section" style="display:none">
    <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px">المُشار إليهم</div>
    <div id="tagged-chips"></div>
  </div>
  <div id="users-list"></div>
</div>
<div class="toast-container" id="toast-container"></div>
<script src="js/db.js"></script>
<script>
let taggedUsers=JSON.parse(sessionStorage.getItem('tagged_users')||'[]');
let currentUser, allUsers=[];
async function init(){
  await InstaMina.init();
  currentUser=InstaMina.requireAuth();
  if(!currentUser) return;
  allUsers=await InstaMina.getAllUsers();
  renderUsers(allUsers.filter(u=>u.id!==currentUser.id));
  renderTagged();
}
function renderUsers(users){
  const list=document.getElementById('users-list');
  list.innerHTML='';
  for(const u of users){
    const isTagged=taggedUsers.includes(u.id);
    const row=document.createElement('div');row.className='user-row';
    row.onclick=()=>toggleTag(u.id);
    row.innerHTML=`<div style="position:relative">
      ${u.avatar?`<img src="${u.avatar}" class="avatar" style="width:44px;height:44px">`:`<div class="avatar-placeholder" style="width:44px;height:44px;font-size:16px">${u.username[0].toUpperCase()}</div>`}
      ${isTagged?'<div class="tagged-badge"><i class="fa fa-check"></i></div>':''}
    </div>
    <div style="flex:1"><div style="font-weight:700;font-size:14px">${u.username}${u.isVerified?'<i class="fa fa-check-circle" style="color:var(--blue);font-size:11px;margin-right:4px"></i>':''}</div><div style="font-size:12px;color:var(--text2)">${u.fullName||''}</div></div>
    <i class="fa fa-${isTagged?'check-circle" style="color:var(--blue)':'circle-o" style="color:var(--border)'}"></i>`;
    list.appendChild(row);
  }
}
function renderTagged(){
  const section=document.getElementById('tagged-section');
  const chips=document.getElementById('tagged-chips');
  if(taggedUsers.length===0){section.style.display='none';return;}
  section.style.display='block';
  chips.innerHTML=taggedUsers.map(id=>{const u=allUsers.find(u=>u.id===id);return u?`<div class="tagged-chip">@${u.username} <span onclick="toggleTag(${id})" style="cursor:pointer;color:var(--text2)">✕</span></div>`:''}).join('');
}
function toggleTag(userId){const idx=taggedUsers.indexOf(userId);if(idx>-1)taggedUsers.splice(idx,1);else taggedUsers.push(userId);renderUsers(allUsers.filter(u=>u.id!==currentUser.id));renderTagged();}
async function searchUsers(q){if(!q){renderUsers(allUsers.filter(u=>u.id!==currentUser.id));return;}const results=await InstaMina.searchUsers(q);renderUsers(results.filter(u=>u.id!==currentUser.id));}
function saveTags(){sessionStorage.setItem('tagged_users',JSON.stringify(taggedUsers));showToast(taggedUsers.length>0?`تم الإشارة لـ ${taggedUsers.length} شخص`:'تم إزالة الإشارات');setTimeout(()=>window.location.href='upload-post.html',700);}
function showToast(msg){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2500);}
init();
</script>
</body>
</html>
