<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنستا-مينا - الرسائل</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.conv-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background .2s;border-bottom:1px solid var(--border)}
.conv-item:hover{background:var(--bg2)}
.conv-info{flex:1;min-width:0}
.conv-name{font-weight:700;font-size:14px}
.conv-last{font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-time{font-size:11px;color:var(--text2)}
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 44px - 60px - env(safe-area-inset-bottom));padding-top:44px}
.chat-header{position:fixed;top:0;left:0;right:0;height:64px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 12px;z-index:100}
.chat-messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:8px}
.msg-bubble{max-width:75%;padding:10px 14px;border-radius:20px;font-size:14px;line-height:1.5;word-break:break-word}
.msg-mine{background:var(--blue);color:#fff;border-bottom-left-radius:6px;align-self:flex-end}
.msg-other{background:var(--bg3);color:var(--text);border-bottom-right-radius:6px;align-self:flex-start}
.msg-time{font-size:10px;opacity:.7;margin-top:2px;text-align:right}
.msg-other .msg-time{text-align:left}
.chat-input-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:50}
.chat-input{flex:1;border:1px solid var(--border);border-radius:24px;padding:8px 16px;background:var(--bg2);color:var(--text);font-size:14px;outline:none;resize:none;max-height:100px}
.chat-send{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>
<div class="header">
  <a href="javascript:history.back()" class="back-btn"><i class="fa fa-arrow-right"></i></a>
  <div class="header-title" id="page-title">الرسائل</div>
  <div class="header-actions"><button onclick="showNewMsg()"><i class="fa fa-edit"></i></button></div>
</div>
<div class="page-content" id="main-content"></div>
<nav class="nav-bottom" id="nav">
  <a href="feed.html"><i class="fa fa-home"></i></a>
  <a href="explore.html"><i class="fa fa-search"></i></a>
  <a href="create.html"><i class="fa fa-plus-square-o" style="font-size:30px"></i></a>
  <a href="reels.html"><i class="fa fa-film"></i></a>
  <a href="profile.html"><i class="fa fa-user-o"></i></a>
</nav>
<div class="toast-container" id="toast-container"></div>
<script src="js/db.js"></script>
<script>
let currentUser, chatUser=null;
async function init() {
  await InstaMina.init();
  currentUser = InstaMina.requireAuth();
  if(!currentUser) return;
  const params = new URLSearchParams(location.search);
  const userId = params.get('userId');
  if(userId) {
    chatUser = await InstaMina.getUserById(Number(userId));
    await openChat(chatUser);
  } else {
    await loadConversations();
  }
}
async function loadConversations() {
  document.getElementById('page-title').textContent='الرسائل';
  const convList = await InstaMina.getConversationList(currentUser.id);
  const content = document.getElementById('main-content');
  if(convList.length===0) {
    content.innerHTML='<div class="empty-state"><i class="fa fa-paper-plane"></i><h3>لا توجد رسائل</h3><p>ابدأ محادثة جديدة</p><button class="btn btn-primary" onclick="showNewMsg()">رسالة جديدة</button></div>';
    return;
  }
  content.innerHTML='';
  for(const conv of convList) {
    const u = await InstaMina.getUserById(conv.userId);
    if(!u) continue;
    const item=document.createElement('div'); item.className='conv-item';
    item.onclick=()=>{chatUser=u;openChat(u);};
    item.innerHTML=`
      ${u.avatar?`<img src="${u.avatar}" class="avatar" style="width:52px;height:52px">`:`<div class="avatar-placeholder" style="width:52px;height:52px;font-size:18px">${u.username[0].toUpperCase()}</div>`}
      <div class="conv-info">
        <div class="conv-name">${u.fullName||u.username}${u.isVerified?'<i class="fa fa-check-circle" style="color:var(--blue);font-size:11px;margin-right:4px"></i>':''}</div>
        <div class="conv-last">${conv.lastMessage.text.slice(0,40)}</div>
      </div>
      <div class="conv-time">${InstaMina.timeAgo(conv.lastMessage.createdAt)}</div>`;
    content.appendChild(item);
  }
}
async function openChat(user) {
  if(!user) return;
  chatUser = user;
  document.getElementById('page-title').innerHTML=`${user.avatar?`<img src="${user.avatar}" class="avatar" style="width:32px;height:32px;margin-left:8px">`:`<div class="avatar-placeholder" style="width:32px;height:32px;font-size:12px;margin-left:8px">${user.username[0].toUpperCase()}</div>`} ${user.username}`;
  document.getElementById('nav').style.display='none';
  const content = document.getElementById('main-content');
  content.style.paddingBottom='70px';
  content.innerHTML='<div class="chat-messages" id="chat-messages"></div>';
  content.insertAdjacentHTML('afterbegin', `
    <div class="chat-input-bar">
      <input type="text" class="chat-input" id="chat-input" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="chat-send" onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button>
    </div>`);
  await renderMessages();
  document.querySelector('.chat-messages').scrollTop=9999;
}
async function renderMessages() {
  const msgs = await InstaMina.getConversation(currentUser.id, chatUser.id);
  const list = document.getElementById('chat-messages');
  if(!list) return;
  list.innerHTML='';
  for(const m of msgs) {
    const isMine=m.fromId===currentUser.id;
    const div=document.createElement('div');
    div.innerHTML=`<div class="msg-bubble ${isMine?'msg-mine':'msg-other'}">${m.text}<div class="msg-time">${InstaMina.timeAgo(m.createdAt)}</div></div>`;
    list.appendChild(div);
  }
  list.scrollTop=list.scrollHeight;
}
async function sendMsg() {
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text||!chatUser) return;
  input.value='';
  await InstaMina.sendMessage(currentUser.id,chatUser.id,text);
  await InstaMina.addNotification({userId:chatUser.id,type:'message',fromId:currentUser.id,text:`${currentUser.username}: ${text.slice(0,50)}`});
  await renderMessages();
}
async function showNewMsg() {
  const users = await InstaMina.getAllUsers();
  const others = users.filter(u=>u.id!==currentUser.id);
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal" style="max-height:80vh;overflow-y:auto"><div class="modal-header">رسالة جديدة <button onclick="this.closest('.overlay').remove()"><i class="fa fa-times"></i></button></div>
    ${others.map(u=>`<div class="conv-item" onclick="chatUser=null;history.pushState({},'','messages.html?userId=${u.id}');this.closest('.overlay').remove();init()">
      ${u.avatar?`<img src="${u.avatar}" class="avatar" style="width:44px;height:44px">`:`<div class="avatar-placeholder" style="width:44px;height:44px;font-size:16px">${u.username[0].toUpperCase()}</div>`}
      <div><div style="font-weight:700">${u.username}</div><div style="font-size:12px;color:var(--text2)">${u.fullName||''}</div></div>
    </div>`).join('')}
  </div>`;
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
}
function showToast(msg){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2500);}
init();
</script>
</body>
</html>
