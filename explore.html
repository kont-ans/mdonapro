<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنستا-مينا - الاستكشاف</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.search-bar { padding:8px 12px; position:sticky; top:44px; background:var(--bg); z-index:50; border-bottom:1px solid var(--border); }
.search-input-wrap { position:relative; }
.search-input-wrap i { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--text2); }
.search-input { width:100%; padding:10px 38px 10px 12px; background:var(--bg3); border:none; border-radius:10px; font-size:15px; color:var(--text); outline:none; }
.search-results { padding:8px 0; }
.search-user-item { display:flex; align-items:center; gap:12px; padding:10px 16px; cursor:pointer; transition:background .2s; }
.search-user-item:hover { background:var(--bg2); }
.search-user-info h4 { font-size:14px; font-weight:600; }
.search-user-info p { font-size:12px; color:var(--text2); }
.explore-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; }
.explore-item { position:relative; aspect-ratio:1; overflow:hidden; cursor:pointer; }
.explore-item img { width:100%; height:100%; object-fit:cover; transition:transform .3s; }
.explore-item:hover img { transform:scale(1.05); }
.explore-item.wide { grid-column:span 2; }
.explore-item.tall { grid-row:span 2; }
.explore-item-overlay { position:absolute; inset:0; background:rgba(0,0,0,0); display:flex; align-items:center; justify-content:center; gap:12px; color:#fff; font-weight:700; font-size:14px; transition:background .2s; opacity:0; }
.explore-item:hover .explore-item-overlay { background:rgba(0,0,0,.35); opacity:1; }
.explore-item-placeholder { width:100%; height:100%; background:var(--bg3); display:flex; align-items:center; justify-content:center; }
.category-chips { display:flex; gap:8px; padding:10px 12px; overflow-x:auto; scrollbar-width:none; }
.category-chips::-webkit-scrollbar { display:none; }
.chip { padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600; background:var(--bg3); color:var(--text); cursor:pointer; white-space:nowrap; transition:all .2s; flex-shrink:0; }
.chip.active { background:var(--text); color:var(--bg); }
</style>
</head>
<body>
<div class="header"><div class="header-title">استكشاف</div></div>
<div class="page-content" style="padding-top:44px">
  <div class="search-bar">
    <div class="search-input-wrap">
      <i class="fa fa-search"></i>
      <input type="search" class="search-input" placeholder="ابحث عن أشخاص أو منشورات..." id="search-input" oninput="onSearch(this.value)">
    </div>
  </div>
  <div id="search-results" class="search-results" style="display:none"></div>
  <div id="explore-content">
    <div class="category-chips">
      <div class="chip active" onclick="filterCategory('all',this)">الكل</div>
      <div class="chip" onclick="filterCategory('reels',this)">ريلز</div>
      <div class="chip" onclick="filterCategory('photos',this)">صور</div>
      <div class="chip" onclick="filterCategory('shop',this)">تسوق</div>
    </div>
    <div class="explore-grid" id="explore-grid"></div>
    <div class="loader" id="loader"><div class="spinner"></div></div>
  </div>
</div>
<nav class="nav-bottom">
  <a href="feed.html"><i class="fa fa-home"></i></a>
  <a href="explore.html" class="active"><i class="fa fa-search"></i></a>
  <a href="create.html"><i class="fa fa-plus-square-o" style="font-size:30px"></i></a>
  <a href="reels.html"><i class="fa fa-film"></i></a>
  <a href="profile.html"><i class="fa fa-user-o"></i></a>
</nav>
<div class="toast-container" id="toast-container"></div>
<script src="js/db.js"></script>
<script>
let currentUser, allPosts=[], searchTimeout;
async function init() {
  await InstaMina.init();
  currentUser = InstaMina.requireAuth();
  if(!currentUser) return;
  await loadExplore();
}
async function loadExplore() {
  document.getElementById('loader').style.display='flex';
  allPosts = await InstaMina.getAllPosts();
  const following = await InstaMina.getFollowing(currentUser.id);
  const followingIds = following.map(f=>f.followingId);
  const explorePosts = allPosts.filter(p=>p.userId!==currentUser.id && !followingIds.includes(p.userId));
  const shuffled = [...explorePosts].sort(()=>Math.random()-.5);
  const grid = document.getElementById('explore-grid');
  grid.innerHTML='';
  let i=0;
  for(const post of shuffled.slice(0,30)) {
    const item = document.createElement('div');
    item.className = 'explore-item' + (i%7===0?' wide':'') + (i%11===0?' tall':'');
    item.onclick = ()=>window.location.href=`post.html?id=${post.id}`;
    if(post.image) {
      item.innerHTML=`<img src="${post.image}" loading="lazy" alt=""><div class="explore-item-overlay"><span><i class="fa fa-heart"></i> ${InstaMina.formatCount(post.likesCount||0)}</span><span><i class="fa fa-comment"></i> ${InstaMina.formatCount(post.commentsCount||0)}</span></div>`;
    } else {
      item.innerHTML=`<div class="explore-item-placeholder"><i class="fa fa-image" style="font-size:32px;color:var(--border)"></i></div>`;
    }
    grid.appendChild(item); i++;
  }
  document.getElementById('loader').style.display='none';
}
async function onSearch(q) {
  clearTimeout(searchTimeout);
  const resultsEl = document.getElementById('search-results');
  const exploreEl = document.getElementById('explore-content');
  if(!q.trim()) { resultsEl.style.display='none'; exploreEl.style.display='block'; return; }
  searchTimeout = setTimeout(async()=>{
    resultsEl.style.display='block'; exploreEl.style.display='none';
    resultsEl.innerHTML='<div class="loader"><div class="spinner"></div></div>';
    const users = await InstaMina.searchUsers(q);
    const posts = allPosts.filter(p=>p.caption&&p.caption.includes(q));
    let html='';
    if(users.length===0&&posts.length===0) { html='<div class="empty-state"><i class="fa fa-search"></i><h3>لا نتائج</h3><p>جرب كلمة مختلفة</p></div>'; }
    else {
      if(users.length) {
        html+='<div style="padding:8px 16px;font-size:12px;font-weight:700;color:var(--text2)">الأشخاص</div>';
        for(const u of users) {
          html+=`<div class="search-user-item" onclick="window.location.href='profile.html?userId=${u.id}'">
            ${u.avatar?`<img src="${u.avatar}" class="avatar" style="width:44px;height:44px">`:`<div class="avatar-placeholder" style="width:44px;height:44px;font-size:16px">${u.username[0].toUpperCase()}</div>`}
            <div class="search-user-info"><h4>${u.username}${u.isVerified?'<i class="fa fa-check-circle" style="color:var(--blue);font-size:12px;margin-right:4px"></i>':''}</h4><p>${u.fullName||''} · ${u.followersCount||0} متابع</p></div>
          </div>`;
        }
      }
    }
    resultsEl.innerHTML=html;
  },400);
}
function filterCategory(cat,el) {
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  loadExplore();
}
function showToast(msg) {
  const c=document.getElementById('toast-container');
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  c.appendChild(t); setTimeout(()=>t.remove(),2500);
}
init();
</script>
</body>
</html>
