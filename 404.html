<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنستا-مينا - الصفحة غير موجودة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.error-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;gap:16px}
.error-number{font-size:100px;font-weight:900;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.error-emoji{font-size:64px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.error-title{font-size:22px;font-weight:700}
.error-desc{color:var(--text2);font-size:15px;max-width:280px;line-height:1.6}
.error-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
</style>
</head>
<body>
<div class="error-page">
  <div class="error-emoji">📸</div>
  <div class="error-number">404</div>
  <div class="error-title">عذراً! الصفحة غير موجودة</div>
  <div class="error-desc">الصفحة التي تبحث عنها غير موجودة أو ربما تم نقلها أو حذفها.</div>
  <div class="error-actions">
    <a href="feed.html" class="btn btn-primary"><i class="fa fa-home"></i> الصفحة الرئيسية</a>
    <button onclick="history.back()" class="btn btn-secondary"><i class="fa fa-arrow-right"></i> الصفحة السابقة</button>
  </div>
  <div style="margin-top:24px">
    <a href="explore.html" style="color:var(--text2);font-size:14px"><i class="fa fa-search"></i> استكشاف المنصة</a>
  </div>
</div>
</body>
</html>
