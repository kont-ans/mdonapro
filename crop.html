<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنستا-مينا - قص الصورة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.crop-area{position:relative;overflow:hidden;background:#000;touch-action:none}
.crop-overlay{position:absolute;inset:0;pointer-events:none}
.crop-frame{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
.ratio-btns{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.ratio-btns::-webkit-scrollbar{display:none}
.ratio-btn{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;background:var(--bg3);color:var(--text);cursor:pointer;flex-shrink:0;white-space:nowrap;transition:all .2s}
.ratio-btn.active{background:var(--text);color:var(--bg)}
.crop-actions{display:flex;gap:12px;padding:16px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="header">
  <a href="javascript:history.back()" class="back-btn"><i class="fa fa-arrow-right"></i></a>
  <div class="header-title">قص الصورة</div>
  <button onclick="applyCrop()" style="color:var(--blue);font-weight:700;font-size:15px">تطبيق</button>
</div>
<div class="page-content" style="padding-bottom:20px">
  <div class="crop-area" id="crop-area" style="height:360px">
    <canvas id="crop-canvas" style="width:100%;height:100%;object-fit:contain"></canvas>
    <div class="crop-overlay"></div>
  </div>
  <div class="ratio-btns">
    <div class="ratio-btn active" onclick="setRatio(1,1,this)">1:1</div>
    <div class="ratio-btn" onclick="setRatio(4,5,this)">4:5</div>
    <div class="ratio-btn" onclick="setRatio(9,16,this)">9:16</div>
    <div class="ratio-btn" onclick="setRatio(16,9,this)">16:9</div>
    <div class="ratio-btn" onclick="setRatio(4,3,this)">4:3</div>
    <div class="ratio-btn" onclick="setRatio(null,null,this)">حر</div>
  </div>
  <div style="padding:16px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <span style="font-size:13px;color:var(--text2);width:60px">تدوير</span>
      <input type="range" style="flex:1;accent-color:var(--blue)" id="rotate-slider" min="-180" max="180" value="0" oninput="applyTransform()">
      <span style="font-size:12px;color:var(--text2);width:30px" id="rotate-val">0°</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:13px;color:var(--text2);width:60px">تكبير</span>
      <input type="range" style="flex:1;accent-color:var(--blue)" id="scale-slider" min="50" max="200" value="100" oninput="applyTransform()">
      <span style="font-size:12px;color:var(--text2);width:30px" id="scale-val">1x</span>
    </div>
  </div>
  <div class="crop-actions">
    <button class="btn btn-secondary" style="flex:1" onclick="resetTransform()"><i class="fa fa-refresh"></i> إعادة تعيين</button>
    <button class="btn btn-secondary" style="flex:1" onclick="flipH()"><i class="fa fa-arrows-h"></i> قلب أفقي</button>
    <button class="btn btn-secondary" style="flex:1" onclick="flipV()"><i class="fa fa-arrows-v"></i> قلب رأسي</button>
  </div>
  <div style="padding:0 16px">
    <button class="btn btn-primary btn-full" onclick="applyCrop()"><i class="fa fa-crop"></i> تطبيق وحفظ</button>
  </div>
</div>
<div class="toast-container" id="toast-container"></div>
<script>
let img=null, canvas, ctx, rotate=0, scale=1, flipHVal=1, flipVVal=1;
function init(){
  canvas=document.getElementById('crop-canvas');
  ctx=canvas.getContext('2d');
  const saved=sessionStorage.getItem('upload_image');
  if(saved){img=new Image();img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;drawImage();};img.src=saved;}
  else {document.getElementById('crop-area').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#fff"><p>لا توجد صورة. ارجع لاختيار صورة.</p></div>';}
}
function drawImage(){
  if(!img||!ctx) return;
  ctx.save();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.translate(canvas.width/2,canvas.height/2);
  ctx.rotate(rotate*Math.PI/180);
  ctx.scale(scale*flipHVal,scale*flipVVal);
  ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);
  ctx.restore();
}
function applyTransform(){
  rotate=parseInt(document.getElementById('rotate-slider').value);
  scale=parseInt(document.getElementById('scale-slider').value)/100;
  document.getElementById('rotate-val').textContent=rotate+'°';
  document.getElementById('scale-val').textContent=scale.toFixed(1)+'x';
  drawImage();
}
function setRatio(w,h,el){document.querySelectorAll('.ratio-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function resetTransform(){rotate=0;scale=1;flipHVal=1;flipVVal=1;document.getElementById('rotate-slider').value=0;document.getElementById('scale-slider').value=100;document.getElementById('rotate-val').textContent='0°';document.getElementById('scale-val').textContent='1x';drawImage();}
function flipH(){flipHVal*=-1;drawImage();}
function flipV(){flipVVal*=-1;drawImage();}
function applyCrop(){const data=canvas.toDataURL('image/jpeg',0.9);sessionStorage.setItem('upload_image',data);showToast('تم قص الصورة ✓');setTimeout(()=>window.location.href='upload-post.html',700);}
function showToast(msg){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2500);}
init();
</script>
</body>
</html>
