<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنستا-مينا - الفلاتر</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.editor-img{width:100%;max-height:55vw;object-fit:cover;transition:filter .3s}
.filters-bar{display:flex;gap:12px;padding:16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.filters-bar::-webkit-scrollbar{display:none}
.filter-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0}
.filter-thumb{width:64px;height:64px;border-radius:10px;overflow:hidden;border:2px solid transparent;transition:border-color .2s}
.filter-thumb.active{border-color:var(--blue)}
.filter-thumb img{width:100%;height:100%;object-fit:cover}
.filter-name{font-size:11px;color:var(--text2);white-space:nowrap}
.filter-item.active .filter-name{color:var(--blue);font-weight:700}
.adjust-section{padding:16px}
.adjust-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.adjust-label{font-size:13px;font-weight:600;color:var(--text2);width:80px}
.adjust-slider{flex:1;accent-color:var(--blue)}
.adjust-val{font-size:12px;color:var(--text2);width:30px;text-align:left}
.no-image{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:12px;color:var(--text2);background:var(--bg3)}
</style>
</head>
<body>
<div class="header">
  <a href="javascript:history.back()" class="back-btn"><i class="fa fa-arrow-right"></i></a>
  <div class="header-title">الفلاتر والتعديلات</div>
  <button onclick="applyAndReturn()" style="color:var(--blue);font-weight:700;font-size:15px">تطبيق</button>
</div>
<div class="page-content" style="padding-bottom:20px">
  <canvas id="editor-canvas" style="width:100%;max-height:60vw;display:block"></canvas>
  <div id="no-img" class="no-image" style="display:none"><i class="fa fa-image" style="font-size:48px"></i><p>لا توجد صورة</p><button class="btn btn-primary" onclick="document.getElementById('img-load').click()">اختر صورة</button></div>
  <input type="file" id="img-load" accept="image/*" style="display:none" onchange="loadImage(this)">
  <div style="padding:8px 16px;font-size:13px;font-weight:700;color:var(--text2)">فلاتر</div>
  <div class="filters-bar" id="filters-bar"></div>
  <div style="padding:12px 16px;font-size:13px;font-weight:700;color:var(--text2)">تعديلات</div>
  <div class="adjust-section">
    <div class="adjust-row"><div class="adjust-label">السطوع</div><input type="range" class="adjust-slider" id="brightness" min="0" max="200" value="100" oninput="applyAdjustments();document.getElementById('brightness-v').textContent=this.value-100"></div>
    <div class="adjust-row"><div class="adjust-label">التباين</div><input type="range" class="adjust-slider" id="contrast" min="0" max="200" value="100" oninput="applyAdjustments();document.getElementById('contrast-v').textContent=this.value-100"></div>
    <div class="adjust-row"><div class="adjust-label">التشبع</div><input type="range" class="adjust-slider" id="saturate" min="0" max="300" value="100" oninput="applyAdjustments();document.getElementById('saturate-v').textContent=this.value-100"></div>
    <div class="adjust-row"><div class="adjust-label">الحدة</div><input type="range" class="adjust-slider" id="sharpness" min="0" max="100" value="0" oninput="applyAdjustments()"></div>
  </div>
</div>
<div class="toast-container" id="toast-container"></div>
<script>
const FILTERS=[
  {name:'عادي',css:''},
  {name:'لمعان',css:'brightness(1.2) contrast(1.1)'},
  {name:'بارد',css:'hue-rotate(180deg) saturate(1.5)'},
  {name:'دافئ',css:'sepia(0.3) brightness(1.1)'},
  {name:'أبيض وأسود',css:'grayscale(1)'},
  {name:'فنتاج',css:'sepia(0.5) contrast(1.2)'},
  {name:'فيلمي',css:'contrast(1.3) saturate(0.8)'},
  {name:'غروب',css:'hue-rotate(30deg) saturate(1.5) brightness(1.1)'},
  {name:'أخضر',css:'hue-rotate(120deg) saturate(1.2)'},
  {name:'وردي',css:'hue-rotate(300deg) saturate(1.5)'},
];
let currentFilter='', imgElement=null, canvas, ctx;
function init() {
  canvas=document.getElementById('editor-canvas');
  ctx=canvas.getContext('2d');
  buildFilterBar();
  const saved=sessionStorage.getItem('upload_image');
  if(saved){loadImageFromData(saved);}else{canvas.style.display='none';document.getElementById('no-img').style.display='flex';}
}
function buildFilterBar() {
  const bar=document.getElementById('filters-bar');
  FILTERS.forEach((f,i)=>{
    const item=document.createElement('div');item.className='filter-item'+(i===0?' active':'');
    item.onclick=()=>{currentFilter=f.css;document.querySelectorAll('.filter-item').forEach(el=>el.classList.remove('active'));item.classList.add('active');applyAdjustments();};
    const ph=document.createElement('div');ph.className='filter-thumb'+(i===0?' active':'');
    ph.style.cssText=`background:linear-gradient(135deg,hsl(${i*36},60%,50%),hsl(${i*36+120},60%,40%));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff`;
    ph.textContent='📷';
    item.appendChild(ph);
    const name=document.createElement('div');name.className='filter-name';name.textContent=f.name;
    item.appendChild(name);
    bar.appendChild(item);
  });
}
function loadImage(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{loadImageFromData(e.target.result);};reader.readAsDataURL(file);}
function loadImageFromData(src){imgElement=new Image();imgElement.onload=()=>{canvas.width=imgElement.naturalWidth;canvas.height=imgElement.naturalHeight;canvas.style.display='block';document.getElementById('no-img').style.display='none';applyAdjustments();};imgElement.src=src;}
function applyAdjustments(){if(!imgElement||!ctx)return;const b=document.getElementById('brightness').value/100;const c=document.getElementById('contrast').value/100;const s=document.getElementById('saturate').value/100;ctx.filter=`brightness(${b}) contrast(${c}) saturate(${s}) ${currentFilter}`;ctx.drawImage(imgElement,0,0,canvas.width,canvas.height);}
function applyAndReturn(){if(!imgElement){showToast('لا توجد صورة');return;}const data=canvas.toDataURL('image/jpeg',0.9);sessionStorage.setItem('upload_image',data);showToast('تم تطبيق الفلتر ✓');setTimeout(()=>window.location.href='upload-post.html',800);}
function showToast(msg){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2500);}
init();
</script>
</body>
</html>
