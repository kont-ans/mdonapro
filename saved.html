<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنستا-مينا - المحفوظات</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
</head>
<body>
<div class="header">
  <a href="javascript:history.back()" class="back-btn"><i class="fa fa-arrow-right"></i></a>
  <div class="header-title">المحفوظات</div>
</div>
<div class="page-content">
  <div class="grid-3" id="saved-grid"></div>
  <div id="empty-saved" style="display:none"></div>
</div>
<nav class="nav-bottom">
  <a href="feed.html"><i class="fa fa-home"></i></a>
  <a href="explore.html"><i class="fa fa-search"></i></a>
  <a href="create.html"><i class="fa fa-plus-square-o" style="font-size:30px"></i></a>
  <a href="reels.html"><i class="fa fa-film"></i></a>
  <a href="profile.html"><i class="fa fa-user-o"></i></a>
</nav>
<script src="js/db.js"></script>
<script>
async function init() {
  await InstaMina.init();
  const currentUser=InstaMina.requireAuth();
  if(!currentUser) return;
  const savedItems=await InstaMina.getSavedPosts(currentUser.id);
  const grid=document.getElementById('saved-grid');
  const empty=document.getElementById('empty-saved');
  if(savedItems.length===0){empty.style.display='block';empty.innerHTML='<div class="empty-state"><i class="fa fa-bookmark-o"></i><h3>لا توجد محفوظات</h3><p>احفظ المنشورات لتراها لاحقاً</p></div>';return;}
  for(const s of savedItems) {
    const post=await InstaMina.getPostById(s.postId);
    if(!post) continue;
    const item=document.createElement('div');
    item.className='grid-item';
    item.onclick=()=>window.location.href=`post.html?id=${post.id}`;
    item.innerHTML=post.image?`<img src="${post.image}" style="width:100%;height:100%;object-fit:cover">`:`<div style="width:100%;height:100%;aspect-ratio:1;background:var(--bg3);display:flex;align-items:center;justify-content:center"><i class="fa fa-image" style="color:var(--border)"></i></div>`;
    grid.appendChild(item);
  }
}
init();
</script>
</body>
</html>
