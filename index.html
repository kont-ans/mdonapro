<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مدونتي</title>
  <meta name="description" content="مدونة احترافية"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="/index.html" class="logo">✦ مدونتي</a>
        <nav id="header-nav"></nav>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1 class="hero-title">أهلاً بك في مدونتي</h1>
        <p class="hero-sub">أفكار، تقارير، وتحليلات من وجهة نظري</p>
      </div>
    </section>

    <section class="articles-section">
      <div class="container">
        <div id="maintenance-banner" class="maintenance-banner" style="display:none">
          🔧 الموقع في وضع الصيانة حالياً. يُرجى المعاودة لاحقاً.
        </div>
        <div id="loading" class="loading-state">
          <div class="spinner"></div>
          <p>جاري تحميل المقالات...</p>
        </div>
        <div id="articles-grid" class="articles-grid" style="display:none"></div>
        <div id="empty-state" class="empty-state" style="display:none">
          <p>لا توجد مقالات بعد.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> مدونتي — جميع الحقوق محفوظة</p>
    </div>
  </footer>

  <script src="/auth.js"></script>
  <script src="/script.js"></script>
</body>
</html>
