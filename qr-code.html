<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنستا-مينا - رمز QR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.qr-card{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:24px;margin:24px;padding:32px;display:flex;flex-direction:column;align-items:center;gap:16px}
.qr-frame{background:#fff;border-radius:16px;padding:20px;display:flex;align-items:center;justify-content:center}
canvas{border-radius:8px}
.qr-username{color:#fff;font-size:20px;font-weight:700}
.qr-sub{color:rgba(255,255,255,.7);font-size:13px}
.qr-actions{display:flex;gap:12px;margin-top:8px}
.qr-btn{background:rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;border:none}
.qr-btn:hover{background:rgba(255,255,255,.3)}
.scan-section{padding:20px;text-align:center}
.scan-btn{background:var(--bg3);border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:700;cursor:pointer;border:none;width:100%}
</style>
</head>
<body>
<div class="header">
  <a href="javascript:history.back()" class="back-btn"><i class="fa fa-arrow-right"></i></a>
  <div class="header-title">رمز QR</div>
</div>
<div class="page-content" style="padding-bottom:20px">
  <div class="qr-card">
    <div class="qr-frame">
      <canvas id="qr-canvas" width="200" height="200"></canvas>
    </div>
    <div class="qr-username" id="qr-username">@username</div>
    <div class="qr-sub">امسح رمز QR لمتابعتي</div>
    <div class="qr-actions">
      <button class="qr-btn" onclick="shareQR()"><i class="fa fa-share-alt"></i> مشاركة</button>
      <button class="qr-btn" onclick="downloadQR()"><i class="fa fa-download"></i> حفظ</button>
    </div>
  </div>
  <div class="scan-section">
    <p style="color:var(--text2);font-size:13px;margin-bottom:16px">رمز QR الخاص بملفك الشخصي على إنستا-مينا. شاركه مع أصدقائك ليتابعونك بسهولة.</p>
    <div style="background:var(--bg2);border-radius:12px;padding:16px;font-size:13px;color:var(--text2);text-align:right">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>المنشورات</span><span id="stat-posts" style="font-weight:700;color:var(--text)">-</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>المتابعون</span><span id="stat-followers" style="font-weight:700;color:var(--text)">-</span></div>
      <div style="display:flex;justify-content:space-between"><span>يتابع</span><span id="stat-following" style="font-weight:700;color:var(--text)">-</span></div>
    </div>
  </div>
</div>
<div class="toast-container" id="toast-container"></div>
<script src="js/db.js"></script>
<script>
let currentUser;
async function init() {
  await InstaMina.init();
  currentUser=InstaMina.requireAuth();
  if(!currentUser) return;
  document.getElementById('qr-username').textContent='@'+currentUser.username;
  document.getElementById('stat-posts').textContent=currentUser.postsCount||0;
  document.getElementById('stat-followers').textContent=currentUser.followersCount||0;
  document.getElementById('stat-following').textContent=currentUser.followingCount||0;
  drawQR();
}
function drawQR() {
  const canvas=document.getElementById('qr-canvas');
  const ctx=canvas.getContext('2d');
  const size=200;
  const cellSize=size/25;
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,size,size);
  const text=`instamina:user:${currentUser.username}`;
  // Simple visual QR pattern
  for(let i=0;i<25;i++){
    for(let j=0;j<25;j++){
      const isEdge=(i<3&&j<3)||(i<3&&j>21)||(i>21&&j<3);
      const inner=(i>=1&&i<=1&&j>=1&&j<=1)||(i>=1&&i<=1&&j>=23)||(i>=23&&j>=1&&j<=1);
      const pseudo=((i*j+text.charCodeAt((i*j)%text.length))%3)===0;
      if(isEdge||pseudo){
        ctx.fillStyle='#000';
        ctx.fillRect(j*cellSize,i*cellSize,cellSize,cellSize);
      }
    }
  }
  // Draw frame borders
  [0,1,2].forEach(offset=>{ctx.strokeStyle='#000';ctx.lineWidth=cellSize;ctx.strokeRect((offset+.5)*cellSize,(.5+offset)*cellSize,(3-offset*2-1+offset)*cellSize*7,(3-offset*2-1+offset)*cellSize*7);});
  ctx.fillStyle='#000';
  ctx.fillRect(cellSize,cellSize,cellSize*5,cellSize*5);
  ctx.fillStyle='#fff';
  ctx.fillRect(cellSize*2,cellSize*2,cellSize*3,cellSize*3);
  ctx.fillStyle='#000';
  ctx.fillRect(cellSize*3,cellSize*3,cellSize,cellSize);
}
function shareQR(){if(navigator.share)navigator.share({title:'ملفي على إنستا-مينا',text:`تابعني @${currentUser.username}`}).catch(()=>{});else showToast('شارك رمز QR مع أصدقائك!');}
function downloadQR(){const canvas=document.getElementById('qr-canvas');const a=document.createElement('a');a.download=`instamina_qr_${currentUser.username}.png`;a.href=canvas.toDataURL();a.click();showToast('تم الحفظ');}
function showToast(msg){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2500);}
init();
</script>
</body>
</html>
